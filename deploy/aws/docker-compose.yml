# The whole site on one EC2 server: Caddy (HTTPS) in front of the website and
# the API. Images are built by GitHub Actions (.github/workflows/deploy-aws.yml)
# and pulled here; nothing is built on the server.
#
# Lives at /opt/quickhotels on the server, next to Caddyfile and .env.backend.

x-logging: &logging
  # Container logs stay on the server's disk, capped at 3 × 10 MB each.
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  backend:
    image: ghcr.io/quickhotels247/quickhotels-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.backend
    environment:
      NODE_ENV: production
      PORT: "8080"
    logging: *logging

  frontend:
    image: ghcr.io/quickhotels247/quickhotels-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [backend]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # HTTPS certificates; kept across restarts so Let's Encrypt isn't asked again.
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
