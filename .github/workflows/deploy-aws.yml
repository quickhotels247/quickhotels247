# Builds the backend and website images (Arm, for the t4g server), stores them
# in GitHub's container registry, then restarts the site on the EC2 server.
#
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   EC2_SSH_KEY  (the whole quickhotels-key.pem file)
#   Variables: EC2_HOST (13.127.171.94), NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY (pk_...)
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/quickhotels247

jobs:
  build:
    # Builds natively on Arm, the same as the server.
    runs-on: ubuntu-24.04-arm
    strategy:
      # One image failing doesn't stop the other, so both errors show at once.
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/quickhotels-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/quickhotels-${{ matrix.app }}:${{ github.sha }}
          # Only the website uses these; they are public values baked into its browser code.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.quickhotels247.com
            NEXT_PUBLIC_SITE_URL=https://quickhotels247.com
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ vars.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Copy compose files
        run: |
          scp -i ~/.ssh/ec2.pem deploy/aws/docker-compose.yml deploy/aws/Caddyfile \
            ubuntu@${{ vars.EC2_HOST }}:/opt/quickhotels/

      - name: Pull and restart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/ec2.pem ubuntu@${{ vars.EC2_HOST }} \
            "TOKEN='$TOKEN' ACTOR='$ACTOR' TAG='$TAG' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/quickhotels
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # Saved so any later 'docker compose up' keeps this same version.
          echo "IMAGE_TAG=$TAG" > .env
          docker compose pull
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          # The backend runs migrations, then answers on /api/health.
          for i in $(seq 1 30); do
            if docker compose exec -T backend wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "Backend healthy"; exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy; last logs:"
          docker compose logs --tail=80 backend
          exit 1
          EOF
